<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>My World</title>
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
		<link rel="stylesheet" href="/static/style.css">
		<script src="/static/app.js" defer></script>
	</head>
	<body data-page="library">
		<header class="topbar">
			<a class="brand" href="/">
				<img class="brand-mark" src="/static/favicon.svg" alt="">
				My World
			</a>
			<nav id="kinds" class="kinds"></nav>
			<div class="whoami">
				<img id="avatar" class="avatar" src="/static/favicon.svg" alt="">
				<span id="who"></span>
				<button id="logout" type="button">Sign out</button>
			</div>
		</header>
		<main class="content">
			<p id="error" class="warning" hidden></p>
			<!-- one toolbar for every tab: a control that does not apply is disabled, never hidden -->
			<div class="world-tools">
				<input id="world-search" type="search" placeholder="Search" aria-label="Search">
				<select id="type-filter" aria-label="Type" disabled></select>
				<span class="sort">
					<select id="sort-field" aria-label="Sort by"></select>
					<button id="sort-direction" type="button" class="icon-button"></button>
				</span>
				<span id="world-count" class="empty"></span>
				<div id="layouts" class="layouts" role="group" aria-label="Layout"></div>
			</div>
			<section id="world-view" hidden>
				<div id="cards" class="cards"></div>
				<table id="people" class="entries" hidden>
					<thead>
						<tr>
							<th>First name</th>
							<th>Surname</th>
							<th>Type</th>
							<th>Organizations</th>
							<th>Description</th>
							<th><span class="visually-hidden">Connections</span></th>
						</tr>
					</thead>
					<tbody id="people-rows"></tbody>
				</table>
				<table id="types" class="entries" hidden>
					<thead>
						<tr>
							<th>Name</th>
							<th>Description</th>
							<th>Organizations</th>
						</tr>
					</thead>
					<tbody id="type-rows"></tbody>
				</table>
				<table id="person-types-table" class="entries" hidden>
					<thead>
						<tr>
							<th>Name</th>
							<th>Description</th>
							<th>People</th>
						</tr>
					</thead>
					<tbody id="person-type-rows"></tbody>
				</table>
			</section>
			<section id="library-view">
				<p id="empty" class="empty" hidden></p>
				<table id="entries" class="entries" hidden>
					<thead>
						<tr>
							<th>Title</th>
							<th id="creator-column">Creator</th>
							<th>Year</th>
							<th>Status</th>
							<th>Rating</th>
							<th>Started</th>
							<th>Finished</th>
							<th>Notes</th>
						</tr>
					</thead>
					<tbody id="rows"></tbody>
				</table>
			</section>
		</main>
		<button id="fab" class="fab" type="button" aria-label="Add" title="Add">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
		</button>
		<dialog id="add-dialog" class="dialog" aria-labelledby="dialog-title">
			<h2 id="dialog-title">Add</h2>
			<p id="dialog-error" class="warning" hidden></p>
			<!-- a book, film, series, album or game; the film search fills it from The Movie Database -->
			<form id="add-form" class="dialog-form" hidden>
				<div id="movie-search" class="movie-search" hidden>
					<div class="row">
						<label class="wide">Find on The Movie Database <input id="movie-query" placeholder="Title, e.g. Dune" autocomplete="off"></label>
						<button type="button" id="movie-find">Find</button>
					</div>
					<p id="movie-hint" class="empty" hidden></p>
					<p id="movie-locked" class="empty" hidden>
						Title, director, year and the ids come from The Movie Database and are locked.
						<button type="button" id="movie-unlock" class="link">Enter the film by hand instead</button>
					</p>
					<ul id="movie-results" class="movie-results" hidden></ul>
				</div>
				<div id="movie-ids" class="row" hidden>
					<label>IMDb id <span class="id-field"><input name="imdb_id" readonly placeholder="from the search"><a id="imdb-link" class="id-link" target="_blank" rel="noopener" hidden>open</a></span></label>
					<label>TMDB id <span class="id-field"><input name="tmdb_id" readonly placeholder="from the search"><a id="tmdb-link" class="id-link" target="_blank" rel="noopener" hidden>open</a></span></label>
					<label>Rotten Tomatoes id <span class="id-field"><input name="rotten_tomatoes_id" readonly placeholder="from the search"><a id="rt-link" class="id-link" target="_blank" rel="noopener" hidden>open</a></span></label>
				</div>
				<div class="row">
					<label class="wide">Title <input name="title" required></label>
					<label class="wide"><span id="creator-label">Creator</span> <input name="creator"></label>
					<label>Year <input name="year" type="number" min="0" max="3000"></label>
				</div>
				<div class="row">
					<label>Status <select name="status"></select></label>
					<label>Rating <input name="rating" type="number"></label>
					<label>Started <input name="started_on" type="date"></label>
					<label>Finished <input name="finished_on" type="date"></label>
				</div>
				<div class="row">
					<label class="wide">Notes <input name="notes"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="concert-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">Name <input name="name" required placeholder="Who or what, e.g. Avishai Cohen Trio"></label>
					<label class="wide">Event <input name="event" placeholder="Festival, tour, occasion"></label>
				</div>
				<div class="row">
					<label class="wide">Performers <span class="chips" data-chips="people" data-field="performers"><input list="people-names" placeholder="Type a name from People" autocomplete="off"></span></label>
					<label>Genre <input name="genre" placeholder="jazz, rock, ..."></label>
				</div>
				<div class="row">
					<label>Date <input name="date" pattern="\d{4}(-\d{2}(-\d{2}(T[0-9:.]+Z)?)?)?" placeholder="YYYY-MM-DD, YYYY-MM or YYYY"></label>
					<label class="wide">Venue <input name="venue"></label>
					<label>City <input name="city"></label>
					<label>Country <input name="country"></label>
				</div>
				<div class="row">
					<label class="wide">With <span class="chips" data-chips="people" data-field="people"><input list="people-names" placeholder="Type a name from People" autocomplete="off"></span></label>
				</div>
				<div class="row">
					<label>Tickets <input name="tickets" type="number" min="0" max="1000"></label>
					<label class="check"><input name="broadcast" type="checkbox"> Seen on TV</label>
				</div>
				<div class="row">
					<label class="wide">Review <input name="review"></label>
				</div>
				<div class="row">
					<label class="wide">Remark <input name="remark"></label>
				</div>
				<div class="row">
					<label class="wide">Photo <input name="photo" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
				</div>
				<div class="row">
					<label class="wide">Photo source <input name="image_source" type="url" placeholder="Where the photo comes from"></label>
					<label>License <input name="image_license" placeholder="CC BY-SA 4.0"></label>
					<label>Author <input name="image_author"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="museum-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">Name <input name="name" required placeholder="e.g. Louvre"></label>
					<label>City <input name="city"></label>
				</div>
				<div class="row">
					<label>Date <input name="date" pattern="\d{4}(-\d{2}(-\d{2}(T[0-9:.]+Z)?)?)?" placeholder="YYYY-MM-DD, YYYY-MM or YYYY"></label>
					<label>Rating <input name="rating" type="number"></label>
					<label>Tickets <input name="tickets" type="number" min="0" max="1000"></label>
				</div>
				<div class="row">
					<label class="wide">Website <input name="url" type="url" placeholder="https://"></label>
				</div>
				<div class="row">
					<label class="wide">With <span class="chips" data-chips="people" data-field="people"><input list="people-names" placeholder="Type a name from People" autocomplete="off"></span></label>
				</div>
				<div class="row">
					<label class="wide">Review <input name="review"></label>
				</div>
				<div class="row">
					<label class="wide">Remark <input name="remark"></label>
				</div>
				<div class="row">
					<label class="wide">Photo <input name="photo" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="person-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">First name <input name="first_name" required></label>
					<label class="wide">Surname <input name="surname"></label>
				</div>
				<div class="row">
					<label class="wide">Types <span class="chips" data-chips="person-types" data-field="types"><input list="person-type-names" placeholder="Type a name from Person types" autocomplete="off"></span></label>
					<label class="wide">Organizations <span class="chips" data-chips="organizations" data-field="organizations"><input list="organization-names" placeholder="Type a name from Organizations" autocomplete="off"></span></label>
				</div>
				<div class="row">
					<label class="wide">Description <input name="description" placeholder="How you know them"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="organization-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">Name <input name="name" required></label>
					<label class="wide">Location <input name="location" placeholder="City, country"></label>
					<label>Type <select name="type_id"></select></label>
				</div>
				<div class="row">
					<label class="wide">What it was to me <input name="functions" placeholder="Comma separated: teaching, consulting, education, ..."></label>
					<label>Status <input name="status" placeholder="active, acquired, defunct"></label>
				</div>
				<div class="row">
					<label class="wide">What happened <input name="what_happened"></label>
				</div>
				<div class="row">
					<label class="wide">Website <input name="website" type="url" placeholder="https://"></label>
				</div>
				<div class="row">
					<label class="wide">Address <input name="address"></label>
				</div>
				<div class="row">
					<label class="wide">Remark <input name="remark"></label>
				</div>
				<div class="row">
					<label class="wide">Logo <input name="photo" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="organization-type-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">Name <input name="name" required placeholder="e.g. Hospital"></label>
				</div>
				<div class="row">
					<label class="wide">Description <input name="description"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<form id="person-type-form" class="dialog-form" hidden>
				<div class="row">
					<label class="wide">Name <input name="name" required placeholder="e.g. Friend"></label>
				</div>
				<div class="row">
					<label class="wide">Description <input name="description"></label>
				</div>
				<div class="dialog-actions">
					<button type="button" class="text danger delete" hidden>Delete</button>
					<button type="button" class="text cancel">Cancel</button>
					<button type="submit">Add</button>
				</div>
			</form>
			<datalist id="people-names"></datalist>
			<datalist id="organization-names"></datalist>
			<datalist id="person-type-names"></datalist>
		</dialog>
		<dialog id="connections-dialog" class="dialog" aria-labelledby="connections-title">
			<h2 id="connections-title"></h2>
			<div id="connections-body" class="connections"></div>
			<div class="dialog-actions">
				<button type="button" id="connections-close">Close</button>
			</div>
		</dialog>
		<footer class="footer">
			<span id="build"></span>
		</footer>
	</body>
</html>
