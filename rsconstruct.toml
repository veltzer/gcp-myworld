# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.pytest]
src_dirs = ["tests"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.zspell]
src_dirs = ["."]

# ─── shell ───────────────────────────────────────────────────────────────────

# --external-sources lets shellcheck follow the tracked .gcp.conf that the
# scripts source, so its variables are seen as assigned.
[processor.shellcheck]
src_dirs = ["scripts", "src", "misc", "config"]
args = ["--external-sources"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_files = ["Dockerfile"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_files = ["package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["src/myworld/static"]

# ─── css ─────────────────────────────────────────────────────────────────────

[processor.stylelint]
src_dirs = ["src/myworld/static"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_dirs = ["src/myworld/static"]
args = ["-c", ".eslint.config.js"]
