<!DOCTYPE html>
<!--
The picture a link to the site shows when it is shared (Open Graph og:image,
Twitter's summary_large_image): 1200x630. Rendered to
src/myworld/static/social-card.png by scripts/social_card.sh; edit this, then
run that.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<style>
			html, body { margin: 0; }
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				display: flex;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				color: #fff;
				background:
					radial-gradient(55% 55% at 12% 10%, rgb(244 114 182 / 30%), transparent 70%),
					radial-gradient(45% 55% at 88% 90%, rgb(96 165 250 / 30%), transparent 70%),
					linear-gradient(160deg, #1e1b4b 0%, #312e81 45%, #0f172a 100%);
			}
			.copy {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0 20px 0 80px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 18px;
				font-size: 40px;
				font-weight: 700;
			}
			.brand img { width: 64px; height: 64px; }
			h1 {
				margin: 44px 0 22px;
				font-size: 62px;
				line-height: 1.08;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0;
				max-width: 680px;
				font-size: 27px;
				line-height: 1.4;
				color: #c7d2fe;
			}
			.kinds {
				display: flex;
				gap: 12px;
				margin-top: 40px;
			}
			.kinds span {
				padding: 8px 18px;
				border-radius: 999px;
				font-size: 20px;
				font-weight: 600;
				background: rgb(255 255 255 / 12%);
				border: 1px solid rgb(255 255 255 / 20%);
			}
			.art {
				flex: none;
				width: 440px;
				height: 630px;
				object-fit: contain;
				object-position: center;
				filter: drop-shadow(0 20px 40px rgb(0 0 0 / 35%));
			}
		</style>
	</head>
	<body>
		<div class="copy">
			<div class="brand"><img src="../src/myworld/static/favicon.svg" alt="">My World</div>
			<h1>Everything you read, watch, hear and play.</h1>
			<p>What you finished, what you are in the middle of, what you want next, and what you thought of it.</p>
			<div class="kinds"><span>Books</span><span>Concerts</span><span>Museums</span><span>Courses</span><span>YouTube</span></div>
		</div>
		<img class="art" src="../src/myworld/static/scene.svg" alt="">
	</body>
</html>
