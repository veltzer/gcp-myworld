gcp_configuration_name=myworld

# Where and how the app is deployed. The utils-bash scripts do the work:
# gcloud_project_setup.sh creates the resources once, gcloud_deploy.sh
# deploys, gcloud_run_domain.sh maps the domain, gcloud_sql_psql.sh opens
# psql on the database.
gcp_project=id-veltzer-myworld
gcp_service=myworld
gcp_region=us-central1
gcp_sql_instance=myworld-db
gcp_db_name=myworld
gcp_db_user=myworld

# OAuth 2.0 web client ID used for "Sign in with Google". Client IDs are not
# secret. Created by hand in the console (see doc/deploy.md) and pasted here.
gcp_oauth_client_id=128611236287-p97h3qsndvt1m480h6e3avdjd3gl3ira.apps.googleusercontent.com

# OAuth client ID for "Continue with GitHub"; not secret (the secret is in
# gcp_secrets below). Leave it empty to hide the button.
gcp_github_client_id=Ov23lihYZ0JhNvwyBOqE

# Custom domain, bought at Cloudflare. Mapped to the service with a Cloud Run
# domain mapping (see doc/deploy.md); the DNS records live at Cloudflare.
gcp_domain=myworld.stream
# More hostnames the site is served on as it is, each with its own domain
# mapping and its own registration at the sign-in providers (see
# doc/deploy.md); space separated. Any other hostname is redirected to
# gcp_domain.
gcp_alias_domains="myworld.veltzer.org"

# ─── one-time setup (gcloud_project_setup.sh) ────────────────────────────────

gcp_service_account="${gcp_service}-app-sa@${gcp_project}.iam.gserviceaccount.com"
gcp_service_account_roles=(
	roles/cloudsql.client
	roles/secretmanager.secretAccessor
	# Identity Platform sends the verification mail of email sign-up
	roles/identitytoolkit.admin
	# the service starts the import job (gcp_job_name) for each import run, with the run's id as its argument
	roles/run.jobsExecutorWithOverrides
)
# The smallest PostgreSQL instance there is; billed per hour regardless of use.
gcp_sql_args=(
	--database-version POSTGRES_17
	--edition ENTERPRISE
	--tier db-f1-micro
	--storage-type HDD
	--storage-size 10GB
	--no-storage-auto-increase
	--availability-type zonal
	--backup-start-time 03:00
)
# Secrets the service mounts (see gcp_run_args); the database password
# <service>-db-pass is generated by the Cloud SQL step.
gcp_secrets=(
	"${gcp_service}-secret-key=random:hex:32"
	"${gcp_service}-tmdb-key=pass:keys/themoviedb.org.key"
	"${gcp_service}-github-client-secret=pass:keys/github.com.myworld-oauth"
	# the secret of the Google web client (gcp_oauth_client_id), for connecting YouTube (doc/imports.md)
	"${gcp_service}-google-client-secret=pass:keys/google.com.myworld-oauth"
)

# ─── deploy (gcloud_deploy.sh) ───────────────────────────────────────────────

# The import job (doc/imports.md): each import run is an execution of it,
# `python -m myworld.importers.worker <run id>`, started by the service.
gcp_job_name="${gcp_service}-import"
# what the service and the job both see
gcp_env_vars="INSTANCE_CONNECTION_NAME=${gcp_project}:${gcp_region}:${gcp_sql_instance},DB_USER=${gcp_db_user},DB_NAME=${gcp_db_name},GOOGLE_CLIENT_ID=${gcp_oauth_client_id},GITHUB_CLIENT_ID=${gcp_github_client_id},CANONICAL_HOST=${gcp_domain},ALIAS_HOSTS=${gcp_alias_domains}"
gcp_env_secrets="DB_PASS=${gcp_service}-db-pass:latest,SECRET_KEY=${gcp_service}-secret-key:latest,TMDB_API_KEY=${gcp_service}-tmdb-key:latest,GITHUB_CLIENT_SECRET=${gcp_service}-github-client-secret:latest,GOOGLE_CLIENT_SECRET=${gcp_service}-google-client-secret:latest"

gcp_run_args=(
	--allow-unauthenticated
	--service-account "${gcp_service_account}"
	--add-cloudsql-instances "${gcp_project}:${gcp_region}:${gcp_sql_instance}"
	--set-env-vars "${gcp_env_vars},IMPORT_JOB=projects/${gcp_project}/locations/${gcp_region}/jobs/${gcp_job_name}"
	--set-secrets "${gcp_env_secrets}"
	--max-instances 2
)

# One task an execution, never retried (the run says how it went); an hour at most.
gcp_job_args=(
	--service-account "${gcp_service_account}"
	--set-cloudsql-instances "${gcp_project}:${gcp_region}:${gcp_sql_instance}"
	--set-env-vars "${gcp_env_vars}"
	--set-secrets "${gcp_env_secrets}"
	--command python
	--args=-m,myworld.importers.worker
	--tasks 1
	--max-retries 0
	--task-timeout 1h
	--cpu 1
	--memory 512Mi
)
