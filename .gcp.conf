gcp_configuration_name=myworld

# Where and how the app is deployed. The utils-bash scripts do the work:
# gcloud_project_setup.sh creates the resources once, gcloud_run_deploy.sh
# deploys, gcloud_run_domain.sh maps the domain, gcloud_sql_psql.sh opens
# psql on the database.
gcp_project=id-veltzer-myworld
gcp_service=myworld
gcp_region=us-central1
gcp_sql_instance=myworld-db
gcp_db_name=myworld
gcp_db_user=myworld

# OAuth 2.0 web client ID used for "Sign in with Google". Client IDs are not
# secret. Created by hand in the console (see doc/deploy.md) and pasted here.
gcp_oauth_client_id=128611236287-p97h3qsndvt1m480h6e3avdjd3gl3ira.apps.googleusercontent.com

# OAuth client ID for "Continue with GitHub"; not secret (the secret is in
# gcp_secrets below). Leave it empty to hide the button.
gcp_github_client_id=Ov23lihYZ0JhNvwyBOqE

# Custom domain, bought at Cloudflare. Mapped to the service with a Cloud Run
# domain mapping (see doc/deploy.md); the DNS records live at Cloudflare.
gcp_domain=myworld.stream

# ─── one-time setup (gcloud_project_setup.sh) ────────────────────────────────

gcp_service_account="${gcp_service}-app-sa@${gcp_project}.iam.gserviceaccount.com"
gcp_service_account_roles=(
	roles/cloudsql.client
	roles/secretmanager.secretAccessor
)
# The smallest PostgreSQL instance there is; billed per hour regardless of use.
gcp_sql_args=(
	--database-version POSTGRES_17
	--edition ENTERPRISE
	--tier db-f1-micro
	--storage-type HDD
	--storage-size 10GB
	--no-storage-auto-increase
	--availability-type zonal
	--backup-start-time 03:00
)
# Secrets the service mounts (see gcp_run_args); the database password
# <service>-db-pass is generated by the Cloud SQL step.
gcp_secrets=(
	"${gcp_service}-secret-key=random:hex:32"
	"${gcp_service}-tmdb-key=pass:keys/themoviedb.org.key"
	"${gcp_service}-github-client-secret=pass:keys/github.com.myworld-oauth"
)

# ─── deploy (gcloud_run_deploy.sh) ───────────────────────────────────────────

gcp_run_args=(
	--allow-unauthenticated
	--service-account "${gcp_service_account}"
	--add-cloudsql-instances "${gcp_project}:${gcp_region}:${gcp_sql_instance}"
	--set-env-vars "INSTANCE_CONNECTION_NAME=${gcp_project}:${gcp_region}:${gcp_sql_instance},DB_USER=${gcp_db_user},DB_NAME=${gcp_db_name},GOOGLE_CLIENT_ID=${gcp_oauth_client_id},GITHUB_CLIENT_ID=${gcp_github_client_id}"
	--set-secrets "DB_PASS=${gcp_service}-db-pass:latest,SECRET_KEY=${gcp_service}-secret-key:latest,TMDB_API_KEY=${gcp_service}-tmdb-key:latest,GITHUB_CLIENT_SECRET=${gcp_service}-github-client-secret:latest"
	--max-instances 2
)
