# Authoritative dependency list for this repo; `rsconstruct tools
# install-deps` and `uv sync` both read it.

[project]
name = "gcp-myworld"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "google-auth",
    "gunicorn",
    "pg8000",
    "requests",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-WebTest",
    "types-requests",
    "webtest",
]

[tool.uv]
# Application repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "google.*",
]
ignore_missing_imports = true
