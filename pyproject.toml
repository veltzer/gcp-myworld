# Authoritative dependency list for this repo; `rsconstruct tool
# install-deps` and `uv sync` both read it.

[project]
name = "gcp-myworld"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "babel",
    "cryptography",
    "flask",
    "google-auth",
    "gunicorn",
    "pg8000",
    "pycountry",
    "requests",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "alembic",
    "chess",
    "pyrefly",
    "pytest",
    "pyyaml",
    "ruff",
    "types-PyYAML",
    "types-WebTest",
    "types-requests",
    "webtest",
]

[tool.uv]
# Application repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    "scripts",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-type-argument = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
# Tests import from here: the myworld package lives in src/ and is not installed;
# scripts/ holds import_world.py, which the tests exercise too.
pythonpath = ["src", "scripts"]
