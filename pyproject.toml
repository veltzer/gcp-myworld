# Authoritative dependency list for this repo; `rsconstruct tool
# install-deps` and `uv sync` both read it.

[project]
name = "gcp-myworld"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "google-auth",
    "gunicorn",
    "pg8000",
    "requests",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-WebTest",
    "types-requests",
    "webtest",
]

[tool.uv]
# Application repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    "src",
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "google.*",
]

[tool.pytest.ini_options]
# Tests import from here: the myworld package lives in src/ and is not installed.
pythonpath = ["src"]
